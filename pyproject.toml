[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "damldg"
version = "0.2.0"
description = "Domain-shift aware meta-learning for speech emotion recognition"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name="Raeshak King Gandhi"}, {name="Vasileios Tsouvalas"}, {name="Nirvana Meratnia"}]
dependencies = ["tensorflow==2.20.0", "numpy==1.26.4", "ml-dtypes==0.5.4", "soundfile==0.13.1", "scipy>=1.14,<2", "librosa==0.11.0", "pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
damldg = "damldg.cli:main"

[tool.setuptools.packages.find]
include = ["damldg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
